<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato - Miguel Olmedo Portfólio</title>
  <meta name="description" content="Entre em contato com Miguel Olmedo, desenvolvedor Front-end." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
  <link rel="icon" type="image/svg+xml" href="img/code-block-svgrepo-com.svg"/>
</head>
<body>

  <!-- Header -->
  <header class="header" id="header">
    <div class="container header-container">
      <div class="header-left">
        <a href="index.html" class="logo"><i class="fa-solid fa-code"></i>Miguel<span>Olmedo</span>.</a>

        <nav class="nav" id="nav">
          <ul class="nav-list">
            <li><a href="index.html" class="nav-link">Início</a></li>
            <li><a href="sobre.html" class="nav-link">Sobre Mim</a></li>
            <li><a href="projetos.html" class="nav-link">Projetos</a></li>
            <li><a href="contato.html" class="nav-link active">Contato</a></li>
          </ul>
        </nav>
      </div>

      <div class="header-socials">
        <a href="https://github.com/Miguel-Olmedo" target="_blank" class="social-icon-btn">
          <img src="img/icons8-github-30.png" alt="GitHub" class="header-social-img">
        </a>
        <a href="https://www.linkedin.com/in/miguel-olmedo-59a343438/" target="_blank" class="social-icon-btn">
          <i class="fab fa-linkedin"></i>
        </a>
      </div>

      <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
        <span class="menu-toggle-line"></span>
      </button>
    </div>
  </header>

  <main style="padding-top: 90px;">
    <!-- Contato -->
    <section class="contato" id="contato">
      <div class="container contato-container">
        <div class="contact-header">
          <div class="availability-pill">
            <span class="pulse-dot"></span>
            <span>Aberto a oportunidades, estágios e networking</span>
          </div>
        </div>

        <div class="contact-links">
          <div class="contact-card email-card">
            <div class="contact-card-info">
              <i class="fa-solid fa-envelope"></i>
              <span>E-mail</span>
            </div>
            <button type="button" id="copy-email-btn" class="btn-copy">Copiar</button>
          </div>

          <a href="https://wa.me/5514998323034" target="_blank" class="contact-card">
            <i class="fa-brands fa-whatsapp"></i>
            <span>WhatsApp</span>
          </a>

          <a href="https://github.com/Miguel-Olmedo" target="_blank" class="contact-card">
            <i class="fa-brands fa-github"></i>
            <span>GitHub</span>
          </a>

          <a href="https://www.linkedin.com/in/miguel-olmedo-59a343438/" target="_blank" class="contact-card">
            <i class="fa-brands fa-linkedin"></i>
            <span>LinkedIn</span>
          </a>
        </div>
        <div class="contato-form-wrapper">
          <form class="contato-form" id="contato-form">
            <div class="form-group">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="nome" placeholder="Seu nome" required />
            </div>
            <div class="form-group">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" placeholder="seu@email.com" required />
            </div>
            <div class="form-group">
              <label for="mensagem">Mensagem</label>
              <textarea id="mensagem" name="mensagem" rows="5" placeholder="Como posso te ajudar?" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Enviar Mensagem</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-container">
      <p class="footer-text">&copy; 2026 MiguelDev. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="https://unpkg.com/scrollreveal"></script>
  <script src="js/main.js"></script>
</body>
</html>
